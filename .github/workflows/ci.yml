# CI：单测 + demo 评测门禁（可复现口径见 README「Evaluation」）
# 依赖说明：requirements.txt 为纯标准库（v0.1 零第三方依赖），无需安装步骤；
# 真实语料 data/corpus.jsonl 不入库（.gitignore），单测使用临时目录自造语料，
# demo 流程由 scripts/make_demo_corpus.py 现场重建，均不依赖 data/。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 要求声明的每个支持版本都真实跑过（requires-python >=3.8，主测 3.9/3.13）
        python-version: ["3.8", "3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: lint 基础门禁（语法错误 / 未定义名称 / 未用变量，ruff 仅 CI 依赖）
        run: |
          pip install ruff
          ruff check --select E9,F .

      - name: 全量单测
        run: python -m unittest discover -s tests

      - name: 安装冒烟——pip 装包后从安装副本加载包数据（synonyms.json 进 wheel）
        run: |
          pip install .
          cd "$(mktemp -d)" && python -c "
          import statute_rag
          from statute_rag.query_expansion import load_synonyms
          assert statute_rag.__version__, 'missing __version__'
          n = len(load_synonyms())
          assert n > 0, 'package data (synonyms.json) missing in installed copy'
          print('install smoke OK: v%s, %d synonym entries' % (statute_rag.__version__, n))
          "

      - name: 数字一致性——两份 README 与 docs/metrics.json 对账（防双语漂移）
        run: python scripts/check_doc_numbers.py

      - name: demo 第一步——生成合成演示语料
        run: python scripts/make_demo_corpus.py

      - name: demo 第二步——评测检索三件套
        run: python scripts/run_eval.py --corpus demo_corpus/corpus.jsonl --gold demo_corpus/gold.jsonl --out-dir demo_corpus

      - name: demo 门禁——断言 hybrid Recall@5 == 100%
        run: |
          python -c "
          import io, re
          t = io.open('demo_corpus/eval_report.md', encoding='utf-8').read()
          rows = [l for l in t.splitlines() if l.startswith('| hybrid')]
          assert len(rows) == 1, 'hybrid 行数异常: %r' % rows
          m = re.search(r'\|\s*([0-9.]+)%', rows[0])
          assert m and float(m.group(1)) == 100.0, 'hybrid Recall@5 != 100%%: %s' % rows[0]
          print('demo gate OK:', rows[0].strip())
          "

      - name: 写 step summary（文档口径提示，非断言）
        run: |
          {
            echo "demo gate: hybrid Recall@5 = 100.0%（合成演示语料，仅验证管线端到端可用）"
            echo "real-gold hybrid Recall@5=44.7% (see docs)"
          } >> "$GITHUB_STEP_SUMMARY"
